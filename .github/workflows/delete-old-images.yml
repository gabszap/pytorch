name: Delete Old Packages

on:
  workflow_dispatch:
    inputs:
      age:
        type: choice
        required: true
        default: 1 Month
        description: Delete versions older than
        options:
          - 1 Hour
          - 12 Hours
          - 1 Day
          - 1 Week
          - 2 Weeks
          - 1 Month
          - 6 Months
          - 1 Year
          - 2 Years
          - 3 Years
          - 4 Years
          - 5 Years
          - All Packages
      dry_run:
        type: boolean
        required: true
        default: true
        description: Log eligible versions without deleting them

permissions:
  contents: read
  packages: write

concurrency:
  group: package-cleanup-${{ github.repository_owner }}-${{ github.event.repository.name }}
  cancel-in-progress: false

jobs:
  delete-old-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old package versions
        uses: actions/github-script@v7
        env:
          PACKAGE_OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
          SELECTED_AGE: ${{ inputs.age }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const MILLISECONDS = Object.freeze({
              hour: 60 * 60 * 1000,
              day: 24 * 60 * 60 * 1000,
            });
            const ageMillisecondsByInput = new Map([
              ["1 Hour", MILLISECONDS.hour],
              ["12 Hours", 12 * MILLISECONDS.hour],
              ["1 Day", MILLISECONDS.day],
              ["1 Week", 7 * MILLISECONDS.day],
              ["2 Weeks", 14 * MILLISECONDS.day],
              ["1 Month", 30 * MILLISECONDS.day],
              ["6 Months", 180 * MILLISECONDS.day],
              ["1 Year", 365 * MILLISECONDS.day],
              ["2 Years", 2 * 365 * MILLISECONDS.day],
              ["3 Years", 3 * 365 * MILLISECONDS.day],
              ["4 Years", 4 * 365 * MILLISECONDS.day],
              ["5 Years", 5 * 365 * MILLISECONDS.day],
              ["All Packages", 0],
            ]);
            const protectedTagNames = new Set(["latest", "latest-cuda"]);

            function requireEnvironmentVariable(name) {
              const value = process.env[name]?.trim();
              if (!value) {
                throw new Error(`Required environment variable ${name} is missing.`);
              }
              return value;
            }

            function parseBooleanInput(name) {
              const value = requireEnvironmentVariable(name);
              if (value === "true") return true;
              if (value === "false") return false;
              throw new Error(`${name} must be either true or false; received ${JSON.stringify(value)}.`);
            }

            function parsePackageVersion(version) {
              const id = String(version?.id ?? "");
              if (!/^\d+$/.test(id)) {
                throw new Error(`Package version has an invalid ID: ${JSON.stringify(version?.id)}.`);
              }

              const tags = version?.metadata?.container?.tags;
              if (!Array.isArray(tags) || tags.some((tag) => typeof tag !== "string")) {
                throw new Error(`Package version ${id} has invalid container tag metadata.`);
              }

              const updatedAt = version?.updated_at;
              const updatedAtMilliseconds = Date.parse(updatedAt);
              if (typeof updatedAt !== "string" || !Number.isFinite(updatedAtMilliseconds)) {
                throw new Error(`Package version ${id} has an invalid updated_at timestamp.`);
              }

              return {
                id,
                tags: [...tags],
                updatedAt,
                updatedAtMilliseconds,
              };
            }

            const owner = requireEnvironmentVariable("PACKAGE_OWNER");
            const packageName = requireEnvironmentVariable("PACKAGE_NAME");
            const selectedAge = requireEnvironmentVariable("SELECTED_AGE");
            const dryRun = parseBooleanInput("DRY_RUN");
            const maximumAgeMilliseconds = ageMillisecondsByInput.get(selectedAge);
            if (maximumAgeMilliseconds === undefined) {
              throw new Error(`Unsupported age selection: ${JSON.stringify(selectedAge)}.`);
            }

            const encodedOwner = encodeURIComponent(owner);
            const encodedPackageName = encodeURIComponent(packageName);
            const versionsPath = `/users/${encodedOwner}/packages/container/${encodedPackageName}/versions`;

            let versionSnapshot;
            try {
              versionSnapshot = await github.paginate(`GET ${versionsPath}`, { per_page: 100 });
            } catch (error) {
              const status = error?.status ?? error?.response?.status;
              if (status === 404) {
                core.notice(`Package ${owner}/${packageName} does not exist yet; nothing to delete.`);
                return;
              }
              throw error;
            }

            if (versionSnapshot.length === 0) {
              core.notice(`Package ${owner}/${packageName} has no versions.`);
              return;
            }

            const packageVersions = versionSnapshot.map(parsePackageVersion);
            const newestVersion = packageVersions.reduce((newest, version) =>
              version.updatedAtMilliseconds > newest.updatedAtMilliseconds ? version : newest
            );
            const nowMilliseconds = Date.now();
            const deletionCandidates = [];

            core.info(
              `Evaluating ${packageVersions.length} versions older than ${selectedAge} ` +
              `(threshold=${maximumAgeMilliseconds}ms, dry_run=${dryRun}).`
            );

            for (const version of packageVersions) {
              const protectedReasons = [];
              const protectedTags = version.tags.filter((tag) => protectedTagNames.has(tag));
              if (protectedTags.length > 0) {
                protectedReasons.push(`carries protected tag(s): ${protectedTags.join(", ")}`);
              }
              if (version.id === newestVersion.id) {
                protectedReasons.push("newest version by updated_at");
              }

              if (protectedReasons.length > 0) {
                core.info(
                  `Protected version id=${version.id} tags=${JSON.stringify(version.tags)} ` +
                  `updated_at=${version.updatedAt}; reasons=${protectedReasons.join("; ")}.`
                );
                continue;
              }

              const ageMilliseconds = nowMilliseconds - version.updatedAtMilliseconds;
              if (ageMilliseconds <= maximumAgeMilliseconds) {
                core.info(
                  `Keeping version id=${version.id} tags=${JSON.stringify(version.tags)} ` +
                  `updated_at=${version.updatedAt}; age=${ageMilliseconds}ms does not exceed threshold.`
                );
                continue;
              }

              core.info(
                `Candidate version id=${version.id} tags=${JSON.stringify(version.tags)} ` +
                `updated_at=${version.updatedAt}; age=${ageMilliseconds}ms.`
              );
              deletionCandidates.push(version);
            }

            if (deletionCandidates.length === 0) {
              core.notice("No old package versions are eligible for deletion.");
              return;
            }

            if (dryRun) {
              core.notice(`Dry run complete; would delete ${deletionCandidates.length} version(s).`);
              return;
            }

            for (const version of deletionCandidates) {
              const deletePath = `${versionsPath}/${encodeURIComponent(version.id)}`;
              const response = await github.request(`DELETE ${deletePath}`);
              core.info(`Deleted version id=${version.id}; status=${response.status}.`);
            }

            core.notice(`Deleted ${deletionCandidates.length} old package version(s).`);
