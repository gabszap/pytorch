name: Docker Build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_BASE: ghcr.io/gabszap/python:3.12-v3-cuda-13.0.3-cudnn-runtime-24.04
  IMAGE_VERSION: 2.13.0-py3.12-v3-cuda-13.0.3-cudnn-runtime-24.04
  PYTHON_VERSION: "3.12"
  PYTHON_VENV_NAME: python_312
  PYTORCH_VERSION: 2.13.0+cu130
  TORCHVISION_VERSION: 0.28.0+cu130
  TORCHAUDIO_VERSION: 2.11.0+cu130
  PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cu130
  XFORMERS_VERSION: 0.0.35
  XFORMERS_INDEX_URL: https://download.pytorch.org/whl/cu130
  XFORMERS_WHEEL: xformers-0.0.35-py39-none-manylinux_2_28_x86_64.whl
  XFORMERS_WHEEL_SHA256: 962eb73f7243fb6a6b68ed85ed8f97780070ee35c1be464eefe3299b0382391d
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  nvidia-cuda:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push NVIDIA CUDA image
        uses: docker/build-push-action@v6
        with:
          context: build
          build-args: |
            IMAGE_BASE=${{ env.IMAGE_BASE }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            PYTHON_VENV_NAME=${{ env.PYTHON_VENV_NAME }}
            PYTORCH_VERSION=${{ env.PYTORCH_VERSION }}
            TORCHVISION_VERSION=${{ env.TORCHVISION_VERSION }}
            TORCHAUDIO_VERSION=${{ env.TORCHAUDIO_VERSION }}
            PYTORCH_INDEX_URL=${{ env.PYTORCH_INDEX_URL }}
            XFORMERS_VERSION=${{ env.XFORMERS_VERSION }}
            XFORMERS_INDEX_URL=${{ env.XFORMERS_INDEX_URL }}
            XFORMERS_WHEEL=${{ env.XFORMERS_WHEEL }}
            XFORMERS_WHEEL_SHA256=${{ env.XFORMERS_WHEEL_SHA256 }}
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
            ${{ env.IMAGE_NAME }}:latest-cuda
            ${{ env.IMAGE_NAME }}:latest
