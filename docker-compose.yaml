# Compose file build variables set in .env
services:
  supervisor:
    platform: linux/amd64
    build:
      context: ./build
      args:
        IMAGE_BASE: ${IMAGE_BASE:-ghcr.io/gabszap/python:3.12-v3-cuda-13.0.3-cudnn-runtime-24.04}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
        PYTHON_VENV_NAME: ${PYTHON_VENV_NAME:-python_312}
        PYTORCH_VERSION: ${PYTORCH_VERSION:-2.13.0+cu130}
        TORCHVISION_VERSION: ${TORCHVISION_VERSION:-0.28.0+cu130}
        TORCHAUDIO_VERSION: ${TORCHAUDIO_VERSION:-2.11.0+cu130}
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cu130}
        XFORMERS_VERSION: ${XFORMERS_VERSION:-0.0.35}
        XFORMERS_INDEX_URL: ${XFORMERS_INDEX_URL:-https://download.pytorch.org/whl/cu130}
        XFORMERS_WHEEL: ${XFORMERS_WHEEL:-xformers-0.0.35-py39-none-manylinux_2_28_x86_64.whl}
        XFORMERS_WHEEL_SHA256: ${XFORMERS_WHEEL_SHA256:-962eb73f7243fb6a6b68ed85ed8f97780070ee35c1be464eefe3299b0382391d}
      tags:
        - "ghcr.io/gabszap/pytorch:${IMAGE_TAG:-2.13.0-py3.12-v3-cuda-13.0.3-cudnn-runtime-24.04}"
        
    image: ghcr.io/gabszap/pytorch:${IMAGE_TAG:-2.13.0-py3.12-v3-cuda-13.0.3-cudnn-runtime-24.04}
    
    ## For NVIDIA GPU access, uncomment this reservation.
    #deploy:
    #  resources:
    #    reservations:
    #      devices:
    #        - driver: nvidia
    #          count: all
    #          capabilities: [gpu]
    
    devices:
      - "/dev/dri:/dev/dri"
      
    volumes:
      # Workspace
      - ./workspace:${WORKSPACE:-/workspace}:rshared
      # Will echo to root-owned authorized_keys file;
      # Avoids changing local file owner
      - ./config/authorized_keys:/root/.ssh/authorized_keys_mount
      - ./config/provisioning/default.sh:/opt/ai-dock/bin/provisioning.sh
    
    ports:
        # SSH available on host machine port 2222 to avoid conflict. Change to suit
        - ${SSH_PORT_HOST:-2222}:22
        # Web UI for easy service access
        - ${SERVICEPORTAL_PORT_HOST:-1111}:${SERVICEPORTAL_PORT_HOST:-1111}
        # Jupyter server
        - ${JUPYTER_PORT_HOST:-8888}:${JUPYTER_PORT_HOST:-8888}
        # Syncthing
        - ${SYNCTHING_UI_PORT_HOST:-8384}:${SYNCTHING_UI_PORT_HOST:-8384}
        - ${SYNCTHING_TRANSPORT_PORT_HOST:-22999}:${SYNCTHING_TRANSPORT_PORT_HOST:-22999}
   
    environment:
        # Don't enclose values in quotes
        - DIRECT_ADDRESS=${DIRECT_ADDRESS:-127.0.0.1}
        - DIRECT_ADDRESS_GET_WAN=${DIRECT_ADDRESS_GET_WAN:-false}
        - WORKSPACE=${WORKSPACE:-/workspace}
        - WORKSPACE_SYNC=${WORKSPACE_SYNC:-false}
        - JUPYTER_TYPE=${JUPYTER_TYPE:-lab}
        - JUPYTER_PORT_HOST=${JUPYTER_PORT_HOST:-8888}
        - JUPYTER_METRICS_PORT=${JUPYTER_METRICS_PORT:-28888}
        - JUPYTER_URL=${JUPYTER_URL:-}
        - CF_TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:-}
        - CF_QUICK_TUNNELS=${CF_QUICK_TUNNELS:-true}
        - WEB_ENABLE_AUTH=${WEB_ENABLE_AUTH:-true}
        - WEB_USER=${WEB_USER:-user}
        - WEB_PASSWORD=${WEB_PASSWORD:-password}
        - SSH_PORT_HOST=${SSH_PORT_HOST:-2222}
        - SERVICEPORTAL_PORT_HOST=${SERVICEPORTAL_PORT_HOST:-1111}
        - SERVICEPORTAL_METRICS_PORT=${SERVICEPORTAL_METRICS_PORT:-21111}
        - SERVICEPORTAL_URL=${SERVICEPORTAL_URL:-}
        - SERVERLESS=${SERVERLESS:-false}
        - SYNCTHING_UI_PORT_HOST=${SYNCTHING_UI_PORT_HOST:-8384}
        - SYNCTHING_TRANSPORT_PORT_HOST=${SYNCTHING_TRANSPORT_PORT_HOST:-22999}
        - SYNCTHING_URL=${SYNCTHING_URL:-}
        #- PROVISIONING_SCRIPT=https://raw.githubusercontent.com/gabszap/pytorch/main/config/provisioning/default.sh
